<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：微信内置浏览器 / 手机 Safari / Chrome 均依赖此标签。
       注意：不要加 user-scalable=no —— 那会禁止用户缩放，是可访问性事故。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>博客交流协会 · 收录独立博客，分享搭建经验</title>
  <meta name="description" content="博客交流协会：收录群友的独立博客，分享搭建经验，欢迎交流与提交。" />
  <meta name="theme-color" content="#fffaf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1d1e20" media="(prefers-color-scheme: dark)" />

  <!-- 社交分享卡片：微信 / QQ 转发时显示成卡片而不是一串网址，直接决定被转发的观感 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="博客交流协会" />
  <meta property="og:title" content="博客交流协会 · 独立博客导航" />
  <meta property="og:description" content="收录群友的独立博客，分享搭建经验，欢迎交流与提交。" />
  <meta property="og:url" content="https://blogexchangeassociation.github.io/" />

  <!-- ===== 样式：Tailwind CSS（CDN 版，无需打包工具） ===== -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    /*
     * 在 Tailwind 生效前同步执行，避免页面闪烁（FOUC）：
     * 主题有三态 —— system（跟随系统，默认）/ light / dark，存在 localStorage。
     */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('bex-theme'); } catch (e) { /* 隐私模式下会抛错 */ }
      var dark = saved === 'dark' ||
        (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto',
                   '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- 自定义样式：骨架屏、卡片入场、横向标签条、随机卡片等 -->
  <style type="text/tailwindcss">
    @layer utilities {
      /* ---------- 骨架屏微光 ---------- */
      @keyframes shimmer { 100% { transform: translateX(100%); } }
      .skeleton { position: relative; overflow: hidden; }
      .skeleton::after {
        content: ''; position: absolute; inset: 0; transform: translateX(-100%);
        background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,.5) 60%, rgba(255,255,255,0) 100%);
        animation: shimmer 1.4s infinite;
      }
      .dark .skeleton::after {
        background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,.06) 60%, rgba(255,255,255,0) 100%);
      }

      /* ---------- 条目淡入 ---------- */
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .fade-up { animation: fadeUp .3s ease-out both; }

      /* ---------- 横向可滑标签条：隐藏滚动条但保留滑动 ---------- */
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .no-scrollbar::-webkit-scrollbar { display: none; }

      /* ---------- 卡片视图的双层虚线错位反馈（做法学自 diygod.cc/friends，纯 CSS 零 JS） ---------- */
      .card-lift { position: relative; }
      .card-lift::before {           /* 下层虚线：向右下偏移 */
        content: ''; position: absolute; inset: 0; border-radius: 1rem;
        border: 1.5px dashed #fdba74; opacity: 0;
        transition: transform .25s ease, opacity .25s ease;
      }
      .dark .card-lift::before { border-color: #9a3412; }
      .card-lift:hover::before { transform: translate(5px, 5px); opacity: 1; }
      /* 箭头飞入 */
      .card-arrow { transition: transform .25s ease, opacity .25s ease; transform: translate(-4px, 4px) rotate(-45deg); opacity: 0; }
      .card-lift:hover .card-arrow { transform: none; opacity: 1; }

      /* ---------- 随机卡片弹层 ---------- */
      .modal-mask { background: rgba(31, 45, 43, .45); backdrop-filter: blur(2px); }
      @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
      .pop-in { animation: popIn .22s cubic-bezier(.2, .8, .3, 1) both; }

      /* ---------- 简介省略行数 ---------- */
      .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

      /* ---------- 隐藏 type=search 的原生清除按钮，统一用自定义按钮 ---------- */
      input[type='search']::-webkit-search-decoration,
      input[type='search']::-webkit-search-cancel-button,
      input[type='search']::-webkit-search-results-button,
      input[type='search']::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; }

      /* ---------- 尊重系统的「减少动态效果」偏好 ---------- */
      @media (prefers-reduced-motion: reduce) {
        .skeleton::after, .fade-up, .pop-in { animation: none !important; }
        .card-lift::before, .card-arrow { transition: none !important; }
      }
    }
  </style>
</head>

<body class="flex min-h-screen flex-col bg-[#fffaf7] text-[#1f2d2b] antialiased
             dark:bg-[#1d1e20] dark:text-[#dadadb]">

  <!-- ===================== 1. 头部 =====================
       设计说明：放弃 v1 的高饱和三色渐变（那是模板站的视觉签名），
       改用暖色浅块 + 单一强调色，头部高度在手机上压到 ~170px，
       让第一屏能露出 2-3 个博客条目。 -->
  <header class="relative overflow-hidden border-b border-[#efe4da] bg-gradient-to-b from-[#fff7ed] to-[#fffaf7]
                 dark:border-[#333333] dark:from-[#242427] dark:to-[#1d1e20]">
    <div class="mx-auto w-full max-w-3xl px-4 pb-5 pt-4 sm:px-6 sm:pb-8 sm:pt-10">

      <!-- 主题切换 -->
      <div class="flex justify-end">
        <button id="theme-toggle" type="button" title="切换主题"
                aria-label="切换主题（跟随系统 / 浅色 / 深色）"
                class="rounded-full border border-[#efe4da] bg-white/70 p-2 text-[#5c6b69] transition
                       hover:border-[#c2410c]/40 hover:text-[#c2410c] active:scale-95
                       focus:outline-none focus-visible:ring-2 focus-visible:ring-[#c2410c]/40
                       dark:border-[#3a3a40] dark:bg-white/5 dark:text-[#9b9c9d]
                       dark:hover:border-[#fb923c]/40 dark:hover:text-[#fb923c]">
          <!-- system：显示器图标 -->
          <svg id="icon-system" class="h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="14" rx="2" /><path d="M8 21h8M12 18v3" />
          </svg>
          <!-- light：太阳 -->
          <svg id="icon-sun" class="hidden h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
          <!-- dark：月亮 -->
          <svg id="icon-moon" class="hidden h-4 w-4 sm:h-5 sm:w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>

      <!-- 标题 / 简介 / 规模声明 -->
      <div class="-mt-5 text-center sm:-mt-8">
        <h1 class="text-2xl font-black tracking-tight text-[#c2410c] sm:text-4xl dark:text-[#fb923c]">
          博客交流协会
        </h1>
        <p class="mx-auto mt-1.5 max-w-xl text-sm leading-relaxed text-[#5c6b69] sm:mt-2 sm:text-base dark:text-[#9b9c9d]">
          收录独立博客，分享搭建经验，欢迎交流与提交
        </p>
        <!-- 规模与活跃度声明：调研显示这是目录站最重要的可信度锚点 -->
        <p id="site-stats" class="mt-2 text-xs text-[#8a9694] sm:mt-3 dark:text-[#6b6c6d]"></p>
      </div>
    </div>
  </header>

  <!-- ===================== 2. 工具栏（sticky） ===================== -->
  <div class="sticky top-0 z-30 border-b border-[#efe4da] bg-[#fffaf7]/90 backdrop-blur
              dark:border-[#333333] dark:bg-[#1d1e20]/90">
    <div class="mx-auto w-full max-w-3xl px-4 py-3 sm:px-6">

      <!-- 第一行：搜索 + 随机 + 视图切换 -->
      <div class="flex items-center gap-2">
        <div class="relative min-w-0 flex-1">
          <label for="search-input" class="sr-only">搜索博客</label>
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-[#8a9694]"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          <input id="search-input" type="search" autocomplete="off" enterkeyhint="search"
                 placeholder="搜索名称、作者、简介或标签…"
                 class="w-full rounded-xl border border-[#efe4da] bg-white py-2.5 pl-9 pr-9 text-sm
                        text-[#1f2d2b] placeholder:text-[#8a9694]
                        focus:border-[#c2410c] focus:outline-none focus:ring-2 focus:ring-[#c2410c]/20
                        dark:border-[#3a3a40] dark:bg-[#242427] dark:text-[#dadadb]
                        dark:placeholder:text-[#6b6c6d] dark:focus:border-[#fb923c]" />
          <button id="search-clear" type="button" aria-label="清空搜索"
                  class="absolute right-2.5 top-1/2 hidden -translate-y-1/2 rounded-full p-1 text-[#8a9694]
                         transition hover:text-[#c2410c] dark:hover:text-[#fb923c]">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
          </button>
        </div>

        <!-- 随机逛逛：成本 5 行 JS，情感收益极高（调研中 5 个站点都有类似功能） -->
        <button id="random-btn" type="button" title="随机逛逛一个博客" aria-label="随机逛逛一个博客"
                class="shrink-0 rounded-xl border border-[#efe4da] bg-white p-2.5 text-base leading-none transition
                       hover:border-[#c2410c]/40 hover:bg-[#fff7ed] active:scale-95
                       focus:outline-none focus-visible:ring-2 focus-visible:ring-[#c2410c]/40
                       dark:border-[#3a3a40] dark:bg-[#242427] dark:hover:border-[#fb923c]/40
                       dark:hover:bg-[#2e2e33]">🎲</button>

        <!-- 视图切换：列表（默认）/ 网格 -->
        <button id="view-toggle" type="button" title="切换列表 / 网格视图" aria-label="切换列表 / 网格视图"
                class="shrink-0 rounded-xl border border-[#efe4da] bg-white p-2.5 text-[#5c6b69] transition
                       hover:border-[#c2410c]/40 hover:text-[#c2410c] active:scale-95
                       focus:outline-none focus-visible:ring-2 focus-visible:ring-[#c2410c]/40
                       dark:border-[#3a3a40] dark:bg-[#242427] dark:text-[#9b9c9d]
                       dark:hover:border-[#fb923c]/40 dark:hover:text-[#fb923c]">
          <svg id="icon-view-list" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
          </svg>
          <svg id="icon-view-grid" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </button>
      </div>

      <!-- 第二行：标签条（横向可滑，带计数，超出部分折叠进「更多」） -->
      <div class="mt-2.5 flex items-center gap-1.5">
        <div id="tag-bar" class="no-scrollbar -mx-1 flex flex-1 items-center gap-1.5 overflow-x-auto px-1 py-0.5"
             role="group" aria-label="按标签筛选"></div>
        <button id="more-tags-btn" type="button"
                class="hidden shrink-0 rounded-full border border-[#efe4da] bg-white px-3 py-1.5 text-xs
                       font-medium text-[#5c6b69] transition hover:border-[#c2410c]/40 hover:text-[#c2410c]
                       sm:px-2.5 sm:py-1
                       dark:border-[#3a3a40] dark:bg-[#242427] dark:text-[#9b9c9d]"></button>
      </div>

      <!-- 第三行：技术栈筛选。只有 1 种技术栈时没有筛选价值，整行自动隐藏 -->
      <div id="tech-row" class="mt-2 hidden flex-wrap items-center gap-1.5 sm:flex">
        <div id="tech-bar" class="no-scrollbar -mx-1 flex items-center gap-1.5 overflow-x-auto px-1 py-0.5"
             role="group" aria-label="按技术栈筛选"></div>
      </div>
    </div>
  </div>

  <!-- ===================== 3. 主体 ===================== -->
  <main class="mx-auto w-full max-w-3xl flex-1 px-4 py-5 sm:px-6 sm:py-7">

    <!-- 结果计数 + 排序 + 重置：排序属于「结果的属性」，放在这里也比塞进筛选区更省一行高度 -->
    <div class="mb-3 flex items-center gap-1.5">
      <p id="result-count" class="min-w-0 flex-1 text-xs text-[#8a9694] sm:text-sm dark:text-[#6b6c6d]"
         aria-live="polite"></p>
      <label for="sort-select" class="sr-only">排序方式</label>
      <select id="sort-select"
              class="shrink-0 rounded-lg border border-[#efe4da] bg-white px-2 py-1.5 text-xs text-[#5c6b69]
                     focus:border-[#c2410c] focus:outline-none focus:ring-2 focus:ring-[#c2410c]/20
                     dark:border-[#3a3a40] dark:bg-[#242427] dark:text-[#9b9c9d]">
        <option value="recommend">推荐优先</option>
        <option value="updated">最近更新</option>
        <option value="added">最近加入</option>
        <option value="name">按名称</option>
      </select>
      <button id="reset-btn" type="button"
              class="hidden shrink-0 items-center gap-1 rounded-lg border border-[#efe4da] bg-white px-2.5 py-1.5
                     text-xs font-medium text-[#5c6b69] transition hover:border-[#c2410c]/40 hover:text-[#c2410c]
                     dark:border-[#3a3a40] dark:bg-[#242427] dark:text-[#9b9c9d]
                     dark:hover:border-[#fb923c]/40 dark:hover:text-[#fb923c] inline-flex">
        <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" />
        </svg>重置
      </button>
    </div>

    <!-- 博客列表容器：列表 / 网格两种视图共用同一个容器 -->
    <section id="blog-list" aria-label="博客列表" class="flex flex-col"></section>

    <!-- 无 JS 时的兜底：目录站如果离开 JS 就一片空白，等于对搜索引擎和分享预览隐身
         （调研中博友圈、个站商店都是这个毛病）。这段由 tools/build.mjs 自动生成。 -->
    <noscript>
      <!-- build:noscript:start -->
      <!-- 本段由 tools/build.mjs 从 data/blogs.json 自动生成，请勿手工编辑 -->
      <div class="rounded-xl border border-[#efe4da] bg-white p-4 dark:border-[#333333] dark:bg-[#242427]">
        <p class="text-sm font-medium text-[#1f2d2b] dark:text-[#dadadb]">
          你的浏览器未启用 JavaScript，因此搜索与筛选不可用。以下是本站收录的 5 个博客：
        </p>
        <ul class="mt-3 space-y-2 text-sm text-[#5c6b69] dark:text-[#9b9c9d]">
          <li><a href="https://example.com" target="_blank" rel="noopener noreferrer">码农小站</a> <span class="text-[#8a9694]">— 阿柴 · Hexo</span><br><span class="text-[#8a9694]">一个前端工程师的独立博客，记录从零搭建博客的全过程，分享 JavaScript、CSS 与工程化的踩坑笔记。</span></li>
          <li><a href="https://example.org" target="_blank" rel="noopener noreferrer">深夜书房</a> <span class="text-[#8a9694]">— 林小满 · Typecho</span><br><span class="text-[#8a9694]">读书、电影与生活随笔，每周更新一篇长文，偶尔写点关于写作本身的思考。</span></li>
          <li><a href="https://example.net" target="_blank" rel="noopener noreferrer">像素与代码</a> <span class="text-[#8a9694]">— Kai · Astro</span><br><span class="text-[#8a9694]">设计与开发的交叉地带：独立开发作品复盘、UI 细节拆解，以及我用来记录灵感的小工具集。</span></li>
          <li><a href="https://example.edu" target="_blank" rel="noopener noreferrer">山间来信</a> <span class="text-[#8a9694]">— 老周 · Hugo</span><br><span class="text-[#8a9694]">住在山里的第十年，写植物、天气、修屋子和偶尔来访的人。更新很慢，但一直在写。</span></li>
          <li><a href="https://example.io" target="_blank" rel="noopener noreferrer">字节手记</a> <span class="text-[#8a9694]">— 小陈 · WordPress</span><br><span class="text-[#8a9694]">后端与运维笔记：分布式系统、数据库调优，以及那些踩过的生产事故。</span></li>
        </ul>
      </div>
<!-- build:noscript:end -->
    </noscript>

    <!-- 空状态 -->
    <div id="empty-state" class="hidden py-14 text-center">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-[#f4efea] text-[#8a9694]
                  dark:bg-[#2e2e33] dark:text-[#6b6c6d]">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
      </div>
      <p class="mt-3 text-sm font-medium text-[#1f2d2b] dark:text-[#dadadb]">没有找到匹配的博客</p>
      <p class="mt-1 text-xs text-[#8a9694] dark:text-[#6b6c6d]">换个关键词，或点击「重置」查看全部</p>
      <button id="empty-reset" type="button"
              class="mt-4 rounded-xl bg-[#c2410c] px-4 py-2 text-sm font-medium text-white transition
                     hover:bg-[#9a3412] active:scale-95 dark:bg-[#fb923c] dark:text-[#1d1e20]">
        查看全部博客
      </button>
    </div>

    <!-- 勤更榜：只靠比对 updated 字段排序即可算出，无需后端，且比浏览量榜诚实 -->
    <section id="diligent-section" class="mt-9 hidden">
      <details class="rounded-2xl border border-[#efe4da] bg-white/70 p-4 dark:border-[#333333] dark:bg-[#242427]/60">
        <summary class="flex cursor-pointer list-none items-center gap-2 text-sm font-bold
                        text-[#1f2d2b] dark:text-[#dadadb]">
          <span>▸</span>
          勤更榜
          <span class="text-xs font-normal text-[#8a9694] dark:text-[#6b6c6d]">最近更新最勤快的博客</span>
        </summary>
        <ol id="diligent-list" class="mt-3 flex flex-col gap-2"></ol>
      </details>
    </section>

    <!-- 异常名录：把失联 / 长期不更的博客隔离出去，主列表永远保持"活的"
         （做法学自十年之约，这是维护性设计） -->
    <section id="dormant-section" class="mt-4 hidden">
      <details class="rounded-2xl border border-[#efe4da] bg-white/70 p-4 dark:border-[#333333] dark:bg-[#242427]/60">
        <summary class="flex cursor-pointer list-none items-center gap-2 text-sm font-bold
                        text-[#5c6b69] dark:text-[#9b9c9d]">
          <span>▸</span>
          异常名录
          <span id="dormant-count" class="text-xs font-normal text-[#8a9694] dark:text-[#6b6c6d]"></span>
        </summary>
        <ul id="dormant-list" class="mt-3 flex flex-col gap-2"></ul>

    </section>

    <!-- ===================== 4. 评论区 ===================== -->

                class="rounded-xl border border-[#efe4da] px-4 py-2.5 text-sm font-medium text-[#5c6b69]

  <!-- ===================== 页面逻辑 ===================== -->
  <!-- build:script:start -->
  <script>
  (function () {
    'use strict';

    /* ===============================================================
     * 0. 配置与状态
     * ============================================================= */
    var DATA_URL = './data/blogs.json';
    var LS = { theme: 'bex-theme', view: 'bex-view' };
    var DILIGENT_TOP = 10;   // 勤更榜取前几名
    var TAG_COLLAPSE = 10;   // 标签条默认显示几个，其余折叠进「更多」

    var state = {
      blogs: [],
      keyword: '',
      tag: '',
      tech: '',
      sort: 'recommend',
      view: 'list',
      loading: true,
      error: ''
    };

    // 批量取 DOM：把 id 的 kebab-case 转成 camelCase 作为 key
    var el = {};
    ['blog-list', 'empty-state', 'result-count', 'site-stats', 'search-input', 'search-clear',
      'tag-bar', 'more-tags-btn', 'tech-bar', 'tech-row', 'sort-select', 'reset-btn', 'empty-reset',
      'view-toggle', 'icon-view-list', 'icon-view-grid', 'random-btn', 'random-modal', 'random-mask',
      'random-close', 'random-again', 'random-go', 'random-name', 'random-meta', 'random-desc',
      'random-message', 'theme-toggle', 'icon-system', 'icon-sun', 'icon-moon',
      'diligent-section', 'diligent-list', 'dormant-section', 'dormant-list', 'dormant-count',
      'giscus-comments'
    ].forEach(function (id) {
      el[id.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); })] = document.getElementById(id);
    });

    /* ===============================================================
     * 1. 工具函数
     * ============================================================= */

    /** HTML 转义：所有来自 JSON 的文本都要过一遍，防止 XSS 或标签破坏布局 */
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function debounce(fn, delay) {
      var t = null;
      return function () {
        var args = arguments, ctx = this;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(ctx, args); }, delay);
      };
    }

    /** 只接受 http/https，挡掉 javascript: 之类的伪协议 */
    function safeUrl(u) {
      u = String(u || '').trim();
      return /^https?:\/\//i.test(u) ? u : '';
    }

    function hostOf(u) {
      try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
    }

    /** 把各种日期写法解析成时间戳；解析不出来返回 null */
    function parseDate(v) {
      if (!v) return null;
      var t = Date.parse(v);
      return isNaN(t) ? null : t;
    }

    /** 距今天数；非法日期返回 null，未来日期按 0 处理 */
    function daysAgo(v) {
      var t = parseDate(v);
      if (t === null) return null;
      var d = Math.floor((Date.now() - t) / 86400000);
      return d < 0 ? 0 : d;
    }

    /** 相对时间文案 */
    function relativeTime(v) {
      var d = daysAgo(v);
      if (d === null) return '';
      if (d === 0) return '今天更新';
      if (d === 1) return '昨天更新';
      if (d < 30) return d + ' 天前更新';
      if (d < 365) return Math.floor(d / 30) + ' 个月前更新';
      return Math.floor(d / 365) + ' 年前更新';
    }

    /** 新鲜度档位：圆点颜色用。阈值 30 / 180 天 */
    function freshness(b) {
      if (b.status !== 'active') return 'dormant';
      var d = daysAgo(b.updated);
      if (d === null) return 'unknown';
      if (d <= 30) return 'fresh';
      if (d <= 180) return 'stale';
      return 'old';
    }

    /** 名称首字色块：避免热链第三方 favicon（隐私 / 混合内容 / 失败率三重风险） */
    function initialColor(name) {
      var palette = ['#c2410c', '#0f766e', '#7c3aed', '#b45309', '#0369a1', '#9d174d', '#15803d'];
      var h = 0;
      for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
      return palette[h % palette.length];
    }

    function initialAvatar(b) {
      if (b.avatar) {
        return '<img src="' + esc(b.avatar) + '" alt="" loading="lazy" decoding="async" ' +
               'class="h-9 w-9 shrink-0 rounded-full object-cover ring-1 ring-[#efe4da] dark:ring-[#3a3a40]">';
      }
      var ch = b.name.trim().charAt(0) || '博';
      return '<span aria-hidden="true" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full ' +
             'text-sm font-bold text-white" style="background:' + initialColor(b.name) + '">' +
             esc(ch) + '</span>';
    }

    function freshnessBadge(b) {
      var f = freshness(b);
      var dot = {
        fresh: 'bg-[#15803d]', stale: 'bg-[#b45309]', old: 'bg-[#a8a29e]',
        unknown: 'bg-[#d6d3d1] dark:bg-[#4a4a50]', dormant: 'bg-[#a8a29e]'
      }[f];
      var label = b.status === 'dormant' ? '长期未更新' : relativeTime(b.updated);
      if (!label) label = '更新日期未知';
      return '<span class="inline-flex items-center gap-1.5 whitespace-nowrap text-xs text-[#8a9694] ' +
             'dark:text-[#6b6c6d]"><span class="h-2 w-2 shrink-0 rounded-full ' + dot + '"></span>' +
             esc(label) + '</span>';
    }

    /* ===============================================================
     * 2. 数据加载
     * ============================================================= */

    /** 校验并规整单条数据；缺 name / url 的直接丢弃 */
    function normalize(raw) {
      if (!raw || typeof raw !== 'object') return null;
      var url = safeUrl(raw.url);
      var name = String(raw.name || '').trim();
      if (!name || !url) return null;

      var tags = Array.isArray(raw.tags)
        ? raw.tags.map(function (t) { return String(t).trim(); }).filter(Boolean) : [];

      return {
        name: name,
        url: url,
        author: String(raw.author || '').trim() || '匿名',
        description: String(raw.description || '').trim(),
        tags: tags,
        tech: String(raw.tech || '').trim(),
        feed: safeUrl(raw.feed),
        message: String(raw.message || '').trim(),
        added: String(raw.added || '').trim(),
        updated: String(raw.updated || '').trim(),
        avatar: safeUrl(raw.avatar),
        featured: raw.featured === true,
        status: raw.status === 'dormant' ? 'dormant' : 'active'
      };
    }

    function loadBlogs() {
      return fetch(DATA_URL, { cache: 'no-cache' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
          return res.json();
        })
        .then(function (data) {
          var list = Array.isArray(data) ? data
            : (data && Array.isArray(data.blogs) ? data.blogs : []);
          state.blogs = list.map(normalize).filter(Boolean);
        });
    }

    /* ===============================================================
     * 3. 筛选与排序
     * ============================================================= */

    function matches(b) {
      if (b.status !== 'active') return false;                 // 异常名录不进主列表
      if (state.tag && b.tags.indexOf(state.tag) === -1) return false;
      if (state.tech && b.tech !== state.tech) return false;
      if (!state.keyword) return true;
      var kw = state.keyword.toLowerCase();
      return [b.name, b.author, b.description, b.tech, b.tags.join(' ')]
        .join(' ').toLowerCase().indexOf(kw) !== -1;
    }

    function sorted(list) {
      var arr = list.slice();
      if (state.sort === 'updated') {
        arr.sort(function (a, b) { return (parseDate(b.updated) || 0) - (parseDate(a.updated) || 0); });
      } else if (state.sort === 'added') {
        arr.sort(function (a, b) { return (parseDate(b.added) || 0) - (parseDate(a.added) || 0); });
      } else if (state.sort === 'name') {
        arr.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh-Hans-CN'); });
      } else {
        // 推荐优先：featured 置顶，其后按最近更新，再按加入时间
        arr.sort(function (a, b) {
          if (a.featured !== b.featured) return a.featured ? -1 : 1;
          var d = (parseDate(b.updated) || 0) - (parseDate(a.updated) || 0);
          if (d) return d;
          return (parseDate(b.added) || 0) - (parseDate(a.added) || 0);
        });
      }
      return arr;
    }

    /* ===============================================================
     * 4. 渲染：列表条目 / 网格卡片
     * ============================================================= */

    /* 桌面端：卡片上的标签可以直接点来筛选。
       移动端：标签不可点（触屏上 24px 高的小胶囊不适合做点击目标，容易误触），
       筛选统一走顶部的标签条 —— 这也是所有同类站点的做法。 */
    var mqDesktop = window.matchMedia('(min-width: 640px)');

    function tagPillsHtml(tags) {
      var clickable = mqDesktop.matches;
      var cls = 'rounded-md bg-[#f4efea] px-1.5 py-0.5 text-[11px] text-[#5c6b69] ' +
                'dark:bg-[#2e2e33] dark:text-[#9b9c9d]';
      return tags.map(function (t) {
        return clickable
          ? '<button type="button" data-tag="' + esc(t) + '" class="' + cls + ' transition ' +
            'hover:bg-[#efe4da] hover:text-[#c2410c] dark:hover:bg-[#3a3a40] dark:hover:text-[#fb923c]">' +
            esc(t) + '</button>'
          : '<span class="' + cls + '">' + esc(t) + '</span>';
      }).join('');
    }

    function metaLineHtml(b) {
      var parts = ['<span>' + esc(b.author) + '</span>'];
      var host = hostOf(b.url);
      if (host) parts.push('<span aria-hidden="true">·</span><span>' + esc(host) + '</span>');
      if (b.tech) {
        parts.push('<span aria-hidden="true">·</span>' +
          '<button type="button" data-tech="' + esc(b.tech) + '" class="tech-pill transition ' +
          'hover:text-[#c2410c] dark:hover:text-[#fb923c]">' + esc(b.tech) + '</button>');
      }
      return parts.join(' ');
    }

    /** 列表视图条目：内容优先于容器，靠 1px 分隔线而非卡片边框（学 ooh.directory / blogroll.org） */
    function listItemHtml(b, i) {
      return '' +
      '<article class="fade-up border-b border-[#efe4da] dark:border-[#333333]" ' +
               'style="animation-delay:' + Math.min(i * 25, 300) + 'ms">' +
        '<div class="flex items-start gap-3 py-3.5">' +
          initialAvatar(b) +
          '<div class="min-w-0 flex-1">' +
            '<div class="flex flex-wrap items-baseline gap-x-2 gap-y-1">' +
              '<h3 class="min-w-0 text-[17px] font-bold leading-snug sm:text-[19px]">' +
                '<a href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer" ' +
                   'class="text-[#1f2d2b] transition hover:text-[#c2410c] focus:outline-none ' +
                   'focus-visible:ring-2 focus-visible:ring-[#c2410c]/40 dark:text-[#dadadb] ' +
                   'dark:hover:text-[#fb923c]">' + esc(b.name) + '</a>' +
              '</h3>' +
              (b.featured ? '<span class="rounded bg-[#c2410c]/10 px-1.5 py-0.5 text-[10px] font-medium ' +
                'text-[#c2410c] dark:bg-[#fb923c]/15 dark:text-[#fb923c]">推荐</span>' : '') +
              freshnessBadge(b) +
            '</div>' +
            (b.description
              ? '<p class="clamp-2 mt-1 text-sm leading-relaxed text-[#5c6b69] dark:text-[#9b9c9d]">' +
                esc(b.description) + '</p>'
              : '<p class="mt-1 text-sm text-[#a8a29e] dark:text-[#6b6c6d]">这个博客还没有写简介</p>') +
            '<div class="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-[#8a9694] ' +
                 'dark:text-[#6b6c6d]">' + metaLineHtml(b) + '</div>' +
            (b.tags.length ? '<div class="mt-2 flex flex-wrap gap-1">' + tagPillsHtml(b.tags) + '</div>' : '') +
          '</div>' +
        '</div>' +
      '</article>';
    }

    /** 网格视图卡片：双层虚线错位 + 箭头飞入，纯 CSS 反馈 */
    function cardHtml(b, i) {
      return '' +
      '<article class="fade-up card-lift flex h-full flex-col rounded-2xl border border-[#efe4da] ' +
               'bg-white p-4 transition dark:border-[#333333] dark:bg-[#242427]" ' +
               'style="animation-delay:' + Math.min(i * 25, 300) + 'ms">' +
        '<div class="flex items-start gap-3">' +
          initialAvatar(b) +
          '<div class="min-w-0 flex-1">' +
            '<div class="flex items-start gap-1.5">' +
              '<h3 class="min-w-0 flex-1 text-base font-bold leading-snug">' +
                '<a href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer" ' +
                   'class="text-[#1f2d2b] transition hover:text-[#c2410c] focus:outline-none ' +
                   'focus-visible:ring-2 focus-visible:ring-[#c2410c]/40 dark:text-[#dadadb] ' +
                   'dark:hover:text-[#fb923c]">' + esc(b.name) + '</a>' +
              '</h3>' +
              '<svg class="card-arrow mt-1 h-3.5 w-3.5 shrink-0 text-[#c2410c] dark:text-[#fb923c]" ' +
                   'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" ' +
                   'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<path d="M7 17 17 7M9 7h8v8" /></svg>' +
            '</div>' +
            '<div class="mt-1">' + freshnessBadge(b) + '</div>' +
          '</div>' +
        '</div>' +
        (b.description
          ? '<p class="clamp-3 mt-3 flex-1 text-sm leading-relaxed text-[#5c6b69] dark:text-[#9b9c9d]">' +
            esc(b.description) + '</p>'
          : '<p class="mt-3 flex-1 text-sm text-[#a8a29e] dark:text-[#6b6c6d]">这个博客还没有写简介</p>') +
        '<div class="mt-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-[#8a9694] ' +
             'dark:text-[#6b6c6d]">' + metaLineHtml(b) + '</div>' +
        (b.tags.length ? '<div class="mt-2 flex flex-wrap gap-1">' + tagPillsHtml(b.tags) + '</div>' : '') +
      '</article>';
    }

    /* ===============================================================
     * 5. 渲染：筛选控件
     * ============================================================= */

    var expandedTags = false;

    function chipHtml(kind, value, label, count, active) {
      // 手机端给足纵向 padding，让触控高度 ≥ 32px（横向宽度本就够）
      var base = 'shrink-0 whitespace-nowrap rounded-full border px-3 py-1.5 text-xs font-medium transition ' +
                 'sm:px-2.5 sm:py-1 ';
      var on = 'border-[#c2410c] bg-[#c2410c] text-white dark:border-[#fb923c] dark:bg-[#fb923c] dark:text-[#1d1e20]';
      var off = 'border-[#efe4da] bg-white text-[#5c6b69] hover:border-[#c2410c]/40 hover:text-[#c2410c] ' +
                'dark:border-[#3a3a40] dark:bg-[#242427] dark:text-[#9b9c9d] dark:hover:border-[#fb923c]/40 ' +
                'dark:hover:text-[#fb923c]';
      return '<button type="button" data-' + kind + '="' + esc(value) + '" aria-pressed="' +
             (active ? 'true' : 'false') + '" class="' + base + (active ? on : off) + '">' +
             esc(label) + ' <span class="opacity-60">' + count + '</span></button>';
    }

    function activeBlogs() {
      return state.blogs.filter(function (b) { return b.status === 'active'; });
    }

    /** 标签条：带计数、超出折叠（HeyBlog 一次铺开 200+ 标签是反面教材） */
    function renderTagBar() {
      var freq = {};
      activeBlogs().forEach(function (b) {
        b.tags.forEach(function (t) { freq[t] = (freq[t] || 0) + 1; });
      });
      var tags = Object.keys(freq).sort(function (a, b) {
        return freq[b] - freq[a] || a.localeCompare(b, 'zh-Hans-CN');
      });

      var shown = expandedTags ? tags : tags.slice(0, TAG_COLLAPSE);
      var html = chipHtml('tag', '', '全部', activeBlogs().length, state.tag === '');
      shown.forEach(function (t) { html += chipHtml('tag', t, t, freq[t], state.tag === t); });
      el.tagBar.innerHTML = html;

      var hidden = tags.length - shown.length;
      el.moreTagsBtn.classList.toggle('hidden', hidden <= 0 && !expandedTags);
      el.moreTagsBtn.textContent = expandedTags ? '收起 ▴' : '更多 +' + hidden + ' ▾';
    }

    /** 技术栈筛选条：调研的 14 个同类站里只有 1 个做了这个维度，最有辨识度的切面。
     *  只有 1 种技术栈时没有筛选价值，整行隐藏，避免白占手机屏幕高度。 */
    function renderTechBar() {
      var freq = {};
      activeBlogs().forEach(function (b) {
        if (!b.tech) return;
        freq[b.tech] = (freq[b.tech] || 0) + 1;
      });
      var techs = Object.keys(freq).sort(function (a, b) {
        return freq[b] - freq[a] || a.localeCompare(b, 'zh-Hans-CN');
      });
      if (techs.length < 2) {
        el.techBar.innerHTML = '';
        el.techRow.classList.add('hidden');
        return;
      }
      // 注意：不要用 classList.add('flex')，那会覆盖掉 sm:flex 的断点语义
      el.techRow.classList.remove('hidden');

      var withTech = activeBlogs().filter(function (b) { return b.tech; }).length;
      var html = chipHtml('tech', '', '全部技术栈', withTech, state.tech === '');
      techs.forEach(function (t) { html += chipHtml('tech', t, t, freq[t], state.tech === t); });
      el.techBar.innerHTML = html;
    }

    /* ===============================================================
     * 6. 渲染：勤更榜 / 异常名录 / 统计
     * ============================================================= */

    function renderDiligent() {
      var ranked = activeBlogs()
        .filter(function (b) { return daysAgo(b.updated) !== null; })
        .sort(function (a, b) { return daysAgo(a.updated) - daysAgo(b.updated); })
        .slice(0, DILIGENT_TOP);

      if (ranked.length < 3) { el.diligentSection.classList.add('hidden'); return; }
      el.diligentSection.classList.remove('hidden');

      el.diligentList.innerHTML = ranked.map(function (b, i) {
        var medal = ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';
        return '<li class="flex items-baseline gap-2 text-sm">' +
          '<span class="w-6 shrink-0 text-center text-xs">' + medal + '</span>' +
          '<a href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer" ' +
             'class="min-w-0 flex-1 truncate font-medium text-[#1f2d2b] transition hover:text-[#c2410c] ' +
             'dark:text-[#dadadb] dark:hover:text-[#fb923c]">' + esc(b.name) + '</a>' +
          '<span class="shrink-0 text-xs text-[#8a9694] dark:text-[#6b6c6d]">' +
            esc(relativeTime(b.updated).replace(/更新$/, '') || '—') + '</span>' +
        '</li>';
      }).join('');
    }

    function renderDormant() {
      var list = state.blogs.filter(function (b) { return b.status !== 'active'; });
      if (!list.length) { el.dormantSection.classList.add('hidden'); return; }

      el.dormantSection.classList.remove('hidden');
      el.dormantCount.textContent = '（' + list.length + ' 个）';
      el.dormantList.innerHTML = list.map(function (b) {
        return '<li class="flex flex-wrap items-baseline gap-x-2 text-sm">' +
          '<a href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer" ' +
             'class="font-medium text-[#5c6b69] underline underline-offset-2 hover:text-[#c2410c] ' +
             'dark:text-[#9b9c9d] dark:hover:text-[#fb923c]">' + esc(b.name) + '</a>' +
          '<span class="text-xs text-[#8a9694] dark:text-[#6b6c6d]">' + esc(b.author) + '</span>' +
          (b.updated ? '<span class="text-xs text-[#8a9694] dark:text-[#6b6c6d]">最后更新 ' +
            esc(b.updated) + '</span>' : '') +
        '</li>';
      }).join('');
    }

    /** Hero 的规模与活跃度声明 —— 目录站最重要的可信度锚点 */
    function renderStats() {
      var act = activeBlogs();
      var freshCount = act.filter(function (b) {
        var d = daysAgo(b.updated);
        return d !== null && d <= 30;
      }).length;
      var latest = act
        .map(function (b) { return parseDate(b.updated); })
        .filter(function (t) { return t !== null; })
        .sort(function (a, b) { return b - a; })[0];

      var bits = ['已收录 ' + act.length + ' 个博客'];
      if (freshCount) bits.push('其中 ' + freshCount + ' 个近 30 天有更新');
      if (latest) {
        var d = Math.floor((Date.now() - latest) / 86400000);
        bits.push('最近更新 ' + (d <= 0 ? '就在今天' : d + ' 天前'));
      }
      var dormant = state.blogs.length - act.length;
      if (dormant) bits.push('失联 ' + dormant + ' 个');
      el.siteStats.textContent = bits.join(' · ');
    }

    /* ===============================================================
     * 7. 主渲染
     * ============================================================= */

    function renderSkeleton(n) {
      var row = '<div class="flex items-start gap-3 border-b border-[#efe4da] py-3.5 dark:border-[#333333]">' +
        '<div class="skeleton h-9 w-9 shrink-0 rounded-full bg-[#f4efea] dark:bg-[#2e2e33]"></div>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="skeleton h-4 w-1/3 rounded bg-[#f4efea] dark:bg-[#2e2e33]"></div>' +
          '<div class="skeleton mt-2.5 h-3 w-full rounded bg-[#f4efea] dark:bg-[#2e2e33]"></div>' +
          '<div class="skeleton mt-2 h-3 w-4/5 rounded bg-[#f4efea] dark:bg-[#2e2e33]"></div>' +
        '</div></div>';
      el.blogList.className = 'flex flex-col';
      el.blogList.innerHTML = new Array(n + 1).join(row);
    }

    function render() {
      if (state.loading) {
        el.resultCount.textContent = '正在加载博客列表…';
        el.emptyState.classList.add('hidden');
        renderSkeleton(6);
        return;
      }

      if (state.error) {
        el.blogList.innerHTML = '';
        el.resultCount.textContent = '';
        el.emptyState.classList.remove('hidden');
        var ps = el.emptyState.querySelectorAll('p');
        ps[0].textContent = '博客数据加载失败';
        ps[1].textContent = state.error +
          '（请确认 data/blogs.json 存在，且通过 http 服务访问，而不是直接双击打开文件）';
        el.emptyReset.classList.add('hidden');
        return;
      }

      var list = sorted(state.blogs.filter(matches));
      var isFiltering = !!(state.keyword || state.tag || state.tech);

      // 视图切换：列表单列 / 网格自适应多列
      el.blogList.className = state.view === 'grid'
        ? 'grid grid-cols-1 gap-3 sm:grid-cols-2'
        : 'flex flex-col';
      el.blogList.innerHTML = state.view === 'grid'
        ? list.map(cardHtml).join('')
        : list.map(listItemHtml).join('');

      el.emptyReset.classList.remove('hidden');
      el.emptyState.classList.toggle('hidden', list.length > 0);

      el.resultCount.textContent = isFiltering
        ? '共 ' + list.length + ' 个结果（总计 ' + activeBlogs().length + ' 个博客）'
        : '';
      el.resultCount.classList.toggle('hidden', !isFiltering);

      el.resetBtn.classList.toggle('hidden', !isFiltering);

      if (!list.length) {
        var eps = el.emptyState.querySelectorAll('p');
        eps[0].textContent = isFiltering ? '没有找到匹配的博客' : '还没有收录任何博客';
        eps[1].textContent = isFiltering ? '换个关键词，或点击「重置」查看全部' : '欢迎到评论区推荐你的博客';
      }
    }

    /* ===============================================================
     * 8. 交互
     * ============================================================= */

    function apply(patch) {
      patch = patch || {};
      if (typeof patch.keyword === 'string') state.keyword = patch.keyword.trim();
      if (typeof patch.tag === 'string') state.tag = patch.tag;
      if (typeof patch.tech === 'string') state.tech = patch.tech;

      el.searchClear.classList.toggle('hidden', !state.keyword);
      renderTagBar();
      renderTechBar();
      render();
    }

    el.searchInput.addEventListener('input', debounce(function (e) {
      apply({ keyword: e.target.value });
    }, 180));
    el.searchInput.addEventListener('search', function (e) { apply({ keyword: e.target.value }); });
    el.searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); apply({ keyword: el.searchInput.value }); }
    });
    el.searchClear.addEventListener('click', function () {
      el.searchInput.value = '';
      apply({ keyword: '' });
      el.searchInput.focus();
    });

    // 标签 / 技术栈 / 卡片内胶囊：统一事件委托
    document.addEventListener('click', function (e) {
      var tagChip = e.target.closest('[data-tag]');
      if (tagChip) {
        var t = tagChip.getAttribute('data-tag');
        apply({ tag: t === state.tag ? '' : t });
        return;
      }
      var techChip = e.target.closest('[data-tech]');
      if (techChip) {
        var k = techChip.getAttribute('data-tech');
        apply({ tech: k === state.tech ? '' : k });
      }
    });

    el.moreTagsBtn.addEventListener('click', function () {
      expandedTags = !expandedTags;
      renderTagBar();
    });

    el.sortSelect.addEventListener('change', function (e) {
      state.sort = e.target.value;
      render();
    });

    function resetAll() {
      el.searchInput.value = '';
      state.sort = 'recommend';
      el.sortSelect.value = 'recommend';
      expandedTags = false;
      apply({ keyword: '', tag: '', tech: '' });
    }
    el.resetBtn.addEventListener('click', resetAll);
    el.emptyReset.addEventListener('click', resetAll);

    /* ---------- 视图切换（记忆在 localStorage） ---------- */
    function syncViewIcon() {
      var isGrid = state.view === 'grid';
      el.iconViewList.classList.toggle('hidden', !isGrid);
      el.iconViewGrid.classList.toggle('hidden', isGrid);
    }
    el.viewToggle.addEventListener('click', function () {
      state.view = state.view === 'grid' ? 'list' : 'grid';
      try { localStorage.setItem(LS.view, state.view); } catch (e) {}
      syncViewIcon();
      render();
    });

    /* ---------- 随机逛逛 ---------- */
    function showRandom() {
      var pool = activeBlogs();
      if (!pool.length) return;
      var b = pool[Math.floor(Math.random() * pool.length)];

      el.randomName.textContent = b.name;
      el.randomMeta.textContent = [b.author, b.tech, hostOf(b.url)].filter(Boolean).join(' · ');
      el.randomDesc.textContent = b.description || '这个博客还没有写简介';
      if (b.message) {
        el.randomMessage.textContent = '「' + b.message + '」';
        el.randomMessage.classList.remove('hidden');
      } else {
        el.randomMessage.classList.add('hidden');
      }
      el.randomGo.href = b.url;
      el.randomModal.classList.remove('hidden');
      el.randomModal.classList.add('flex');
      el.randomAgain.focus();
    }

    function hideRandom() {
      el.randomModal.classList.add('hidden');
      el.randomModal.classList.remove('flex');
    }

    el.randomBtn.addEventListener('click', showRandom);
    el.randomAgain.addEventListener('click', showRandom);
    el.randomClose.addEventListener('click', hideRandom);
    el.randomMask.addEventListener('click', hideRandom);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !el.randomModal.classList.contains('hidden')) hideRandom();
    });

    /* ---------- 主题三态：system → light → dark → system ---------- */
    var themeOrder = ['system', 'light', 'dark'];
    var mql = window.matchMedia('(prefers-color-scheme: dark)');

    function currentTheme() {
      var v = null;
      try { v = localStorage.getItem(LS.theme); } catch (e) {}
      return themeOrder.indexOf(v) > -1 ? v : 'system';
    }

    function applyTheme() {
      var t = currentTheme();
      var dark = t === 'dark' || (t === 'system' && mql.matches);
      document.documentElement.classList.toggle('dark', dark);
      el.iconSystem.classList.toggle('hidden', t !== 'system');
      el.iconSun.classList.toggle('hidden', t !== 'light');
      el.iconMoon.classList.toggle('hidden', t !== 'dark');
      el.themeToggle.title = '当前：' +
        { system: '跟随系统', light: '浅色', dark: '深色' }[t] + '，点击切换';
    }

    el.themeToggle.addEventListener('click', function () {
      var next = themeOrder[(themeOrder.indexOf(currentTheme()) + 1) % themeOrder.length];
      try { localStorage.setItem(LS.theme, next); } catch (e) {}
      applyTheme();
    });

    // 跟随系统时，系统主题变化要实时响应
    if (mql.addEventListener) mql.addEventListener('change', function () { applyTheme(); });
    else if (mql.addListener) mql.addListener(function () { applyTheme(); });

    // 跨过 640px 断点时，标签胶囊要在「可点」与「纯展示」之间切换，需要重绘一次
    function onBreakpointChange() { render(); }
    if (mqDesktop.addEventListener) mqDesktop.addEventListener('change', onBreakpointChange);
    else if (mqDesktop.addListener) mqDesktop.addListener(onBreakpointChange);

    /* ===============================================================
     * 9. 启动
     * ============================================================= */
    try {
      var savedView = localStorage.getItem(LS.view);
      if (savedView === 'grid' || savedView === 'list') state.view = savedView;
    } catch (e) {}

    syncViewIcon();
    applyTheme();
    renderSkeleton(6);

    loadBlogs()
      .then(function () {
        state.loading = false;
        renderStats();
        renderTagBar();
        renderTechBar();
        renderDiligent();
        renderDormant();
        render();
      })
      .catch(function (err) {
        state.loading = false;
        state.error = (err && err.message) ? err.message : String(err);
        console.error('[博客交流协会] 数据加载失败：', err);
        render();
      });

    /* ===============================================================
     * 10. Giscus 评论：填入自己的配置后取消注释即可启用
     *     配置获取地址：https://giscus.app/zh-CN
     * ============================================================= */

      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.setAttribute('data-repo', 'BlogExchangeAssociation/BlogExchangeAssociation.github.io');
      s.setAttribute('data-repo-id', 'R_xxxxxxxx');          // ← 换成你的 repo-id
      s.setAttribute('data-category', 'Announcements');
      s.setAttribute('data-category-id', 'DIC_xxxxxxxx');    // ← 换成你的 category-id
      s.setAttribute('data-mapping', 'pathname');
      s.setAttribute('data-strict', '0');
      s.setAttribute('data-reactions-enabled', '1');
      s.setAttribute('data-emit-metadata', '0');
      s.setAttribute('data-input-position', 'bottom');
      s.setAttribute('data-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      s.setAttribute('data-lang', 'zh-CN');
      s.setAttribute('data-loading', 'lazy');

      // 页面主题切换时同步评论框主题

    */
  })();
  </script>
  <!-- build:script:end -->
</body>
